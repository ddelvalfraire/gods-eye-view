services:
  gods-eye-view:
    build: .
    restart: unless-stopped
    environment:
      GEV_ALLOWED_HOSTS: ${GEV_ALLOWED_HOSTS}
      GEV_KEY_SETUP_TRUSTED_PEERS: none
    ports:
      - '127.0.0.1:13811:4173'
    volumes:
      - /data/coolify/gods-eye-view/cache:/app/.gev-cache
      - /data/coolify/gods-eye-view/logs:/app/.gev-logs
